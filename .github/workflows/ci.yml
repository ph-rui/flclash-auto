name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml

      - name: Syntax check
        run: bash -n bin/flclash-auto lib/*.sh install.sh uninstall.sh tests/test.sh

      - name: shellcheck
        run: shellcheck -x bin/flclash-auto lib/*.sh install.sh uninstall.sh tests/test.sh

      - name: Unit tests
        run: tests/test.sh
